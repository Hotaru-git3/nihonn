[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirect specific API endpoints to Netlify Functions
[[redirects]]
  from = "/api/ai/breakdown"
  to = "/.netlify/functions/ai-breakdown"
  status = 200

[[redirects]]
  from = "/api/quiz/generate"
  to = "/.netlify/functions/quiz-generate"
  status = 200

# SPA fallback: redirect all non-file routes to index.html to avoid Netlify 404 on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Environment variables can be set in Netlify UI or here under [build.environment]
# Do NOT commit secrets. Example placeholders (leave empty or set in Netlify UI):
[build.environment]
  # NVIDIA_API_KEY = ""
  # NVIDIA_API_KEY_LLAMA = ""
  # NVIDIA_API_KEY_LLAMA2 = ""
  # NVIDIA_API_KEY_DEEPSEEK = ""
